<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F14"/>
      <stop offset="50%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
    <!-- Amber accent gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#D97706" stroke-width="1">
    <!-- Vertical grid -->
    <line x1="160" y1="0" x2="160" y2="1080"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1120" y1="0" x2="1120" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1760" y1="0" x2="1760" y2="1080"/>
    <!-- Horizontal grid -->
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
  </g>

  <!-- Diagonal accent lines top-right -->
  <g opacity="0.08" stroke="#EA580C" stroke-width="1">
    <line x1="1200" y1="0" x2="1920" y2="400"/>
    <line x1="1350" y1="0" x2="1920" y2="260"/>
    <line x1="1500" y1="0" x2="1920" y2="140"/>
    <line x1="1100" y1="0" x2="1920" y2="560"/>
    <line x1="950" y1="0" x2="1920" y2="720"/>
  </g>

  <!-- Large amber ambient glow (right side) -->
  <ellipse cx="1500" cy="520" rx="520" ry="320" fill="#D97706" opacity="0.07" filter="url(#softGlow)"/>

  <!-- ══ CAR SILHOUETTE — blueprint outline style ══ -->
  <!-- Positioned centre-right so left text area stays dark -->
  <!-- Main body outline -->
  <g transform="translate(820, 280)" filter="url(#glow)" opacity="0.9">
    <!-- Car profile: smooth modern sedan blueprint -->
    <!-- Base / road line -->
    <line x1="-20" y1="420" x2="1020" y2="420" stroke="#D97706" stroke-width="1.5" opacity="0.4"/>

    <!-- Wheel arches and wheels -->
    <!-- Rear wheel arch -->
    <path d="M 80 360 Q 80 290 160 290 Q 240 290 240 360" fill="none" stroke="#D97706" stroke-width="2"/>
    <!-- Rear wheel -->
    <circle cx="160" cy="390" r="62" fill="none" stroke="#D97706" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="160" cy="390" r="44" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>
    <circle cx="160" cy="390" r="20" fill="none" stroke="#EA580C" stroke-width="2"/>
    <!-- Wheel spokes rear -->
    <line x1="160" y1="346" x2="160" y2="434" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>
    <line x1="116" y1="390" x2="204" y2="390" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>
    <line x1="129" y1="359" x2="191" y2="421" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>
    <line x1="191" y1="359" x2="129" y2="421" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>

    <!-- Front wheel arch -->
    <path d="M 680 360 Q 680 290 760 290 Q 840 290 840 360" fill="none" stroke="#D97706" stroke-width="2"/>
    <!-- Front wheel -->
    <circle cx="760" cy="390" r="62" fill="none" stroke="#D97706" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="760" cy="390" r="44" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>
    <circle cx="760" cy="390" r="20" fill="none" stroke="#EA580C" stroke-width="2"/>
    <!-- Wheel spokes front -->
    <line x1="760" y1="346" x2="760" y2="434" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>
    <line x1="716" y1="390" x2="804" y2="390" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>
    <line x1="729" y1="359" x2="791" y2="421" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>
    <line x1="791" y1="359" x2="729" y2="421" stroke="#EA580C" stroke-width="1.5" opacity="0.7"/>

    <!-- Car body lower -->
    <path d="M 60 360 L 50 330 L 30 330 L 30 300 L 900 300 L 900 330 L 870 330 L 860 360 Z"
          fill="none" stroke="#D97706" stroke-width="2" opacity="0.7"/>

    <!-- Car body upper — roofline -->
    <path d="M 160 300 L 200 210 L 260 180 L 540 160 L 680 170 L 730 200 L 760 300"
          fill="none" stroke="#D97706" stroke-width="2.5" filter="url(#glow)"/>

    <!-- Windshield -->
    <path d="M 210 295 L 248 208 L 258 192 L 430 180 L 440 295 Z"
          fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>

    <!-- Rear window -->
    <path d="M 540 165 L 680 172 L 720 195 L 720 295 L 540 295 Z"
          fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>

    <!-- Door lines -->
    <line x1="440" y1="180" x2="440" y2="300" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>
    <line x1="540" y1="165" x2="540" y2="300" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>

    <!-- Front lights -->
    <path d="M 855 310 L 880 315 L 880 330 L 855 330 Z" fill="none" stroke="#EA580C" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="868" cy="320" rx="8" ry="5" fill="#EA580C" opacity="0.8" filter="url(#glow)"/>

    <!-- Rear lights -->
    <path d="M 45 310 L 30 315 L 30 330 L 45 330 Z" fill="none" stroke="#EA580C" stroke-width="2"/>

    <!-- Grille -->
    <path d="M 870 312 L 900 305 L 905 345 L 870 345 Z" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>
    <line x1="885" y1="308" x2="886" y2="342" stroke="#D97706" stroke-width="1" opacity="0.5"/>
    <line x1="870" y1="320" x2="905" y2="318" stroke="#D97706" stroke-width="1" opacity="0.5"/>
    <line x1="870" y1="330" x2="905" y2="330" stroke="#D97706" stroke-width="1" opacity="0.5"/>

    <!-- Mirror -->
    <path d="M 210 240 L 190 235 L 188 250 L 210 250 Z" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.7"/>

    <!-- Door handle -->
    <rect x="330" y="262" width="28" height="8" rx="4" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>
    <rect x="555" y="262" width="28" height="8" rx="4" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ══ TECH ELEMENTS — top right ══ -->
  <!-- Hex cells -->
  <g opacity="0.18" fill="none" stroke="#D97706" stroke-width="1" transform="translate(1620, 80)">
    <polygon points="30,0 60,17 60,52 30,70 0,52 0,17"/>
    <polygon points="90,0 120,17 120,52 90,70 60,52 60,17"/>
    <polygon points="150,0 180,17 180,52 150,70 120,52 120,17"/>
    <polygon points="60,70 90,87 90,122 60,140 30,122 30,87"/>
    <polygon points="120,70 150,87 150,122 120,140 90,122 90,87"/>
    <polygon points="30,140 60,157 60,192 30,210 0,192 0,157"/>
    <polygon points="90,140 120,157 120,192 90,210 60,192 60,157"/>
    <polygon points="150,140 180,157 180,192 150,210 120,192 120,157"/>
  </g>

  <!-- Circuit trace lines — bottom right -->
  <g opacity="0.22" stroke="#EA580C" stroke-width="1.5" fill="none">
    <polyline points="1700,900 1700,850 1750,850 1750,800 1820,800"/>
    <polyline points="1820,840 1820,800"/>
    <polyline points="1650,950 1650,880 1720,880 1720,840 1820,840"/>
    <polyline points="1550,980 1550,920 1620,920 1620,860 1700,860 1700,850"/>
    <circle cx="1750" cy="850" r="4" fill="#EA580C"/>
    <circle cx="1820" cy="800" r="4" fill="#EA580C"/>
    <circle cx="1820" cy="840" r="4" fill="#EA580C"/>
    <circle cx="1700" cy="850" r="4" fill="#EA580C"/>
    <circle cx="1620" cy="860" r="4" fill="#EA580C"/>
  </g>

  <!-- Blueprint cross marks -->
  <g opacity="0.25" stroke="#D97706" stroke-width="1">
    <line x1="1855" y1="185" x2="1875" y2="185"/><line x1="1865" y1="175" x2="1865" y2="195"/>
    <line x1="1785" y1="245" x2="1805" y2="245"/><line x1="1795" y1="235" x2="1795" y2="255"/>
    <line x1="1855" y1="305" x2="1875" y2="305"/><line x1="1865" y1="295" x2="1865" y2="315"/>
  </g>

  <!-- Dimension / measurement lines (blueprint style) -->
  <g opacity="0.3" stroke="#D97706" stroke-width="1">
    <!-- Horizontal dimension -->
    <line x1="820" y1="760" x2="1770" y2="760"/>
    <line x1="820" y1="750" x2="820" y2="770"/>
    <line x1="1770" y1="750" x2="1770" y2="770"/>
    <!-- Vertical dimension -->
    <line x1="1820" y1="280" x2="1820" y2="700"/>
    <line x1="1810" y1="280" x2="1830" y2="280"/>
    <line x1="1810" y1="700" x2="1830" y2="700"/>
    <!-- Labels -->
    <text x="1280" y="750" text-anchor="middle" font-family="monospace" font-size="11" fill="#D97706" opacity="0.6">4,850 mm</text>
    <text x="1835" y="500" text-anchor="start" font-family="monospace" font-size="11" fill="#D97706" opacity="0.6" transform="rotate(-90, 1835, 500)">1,440 mm</text>
  </g>

  <!-- Subtle title watermark -->
  <text x="1300" y="990" text-anchor="middle" font-family="monospace" font-size="13" fill="#D97706" opacity="0.18" letter-spacing="8">AUTOMOTIVE  •  PRECISION  •  CONSULTING</text>

  <!-- Right-side ambient warm tone overlay (makes right side feel lit) -->
  <rect x="1100" y="0" width="820" height="1080" fill="url(#amberGrad)" opacity="0.03"/>
</svg>
